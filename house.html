<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
</head>
<body>

  <!-- House and Garden SVG Scene -->
  <svg width="600" height="450" style="background-color: #dbeafe; border: 1px solid #94a3b8;">
    
    <!-- 1. Grass / Garden Ground (rect) -->
    <rect x="0" y="300" width="600" height="150" fill="#4ade80" />

    <!-- 2. Sun (circle) -->
    <circle cx="500" cy="80" r="45" fill="#facc15" stroke="#f59e0b" stroke-width="3" />

    <!-- 3. Tree Trunk (rect) and Leaves (ellipse) -->
    <rect x="75" y="240" width="25" height="90" fill="#854d0e" />
    <ellipse cx="87" cy="220" rx="45" ry="55" fill="#15803d" />

    <!-- 4. House Base (rect) -->
    <rect x="200" y="200" width="200" height="150" fill="#b45309" />

    <!-- 5. Roof (polygon) -->
    <polygon points="180,200 300,90 420,200" fill="#991b1b" stroke="#7f1d1d" stroke-width="2" />

    <!-- 6. Door (rect) and Knob (circle) -->
    <rect x="275" y="270" width="50" height="80" fill="#3f2e21" />
    <circle cx="315" cy="315" r="4" fill="#fbbf24" />

    <!-- 7. Chimney (rect) and Smoke Line (line) -->
    <rect x="350" y="110" width="30" height="50" fill="#78350f" />
    <line x1="365" y1="105" x2="365" y2="70" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

    <!-- 8. Garden Winding Path (path) -->
    <path d="M 275,350 Q 240,400 200,450 L 330,450 Q 340,400 325,350 Z" fill="#d97706" />

    <!-- 9. Step 4 Grouped Windows with Shared Styles -->
    <g fill="#93c5fd" stroke="#1e293b" stroke-width="3">
      <!-- Left Window placed directly -->
      <rect x="220" y="225" width="40" height="40" rx="4" />
      
      <!-- Right Window positioned using transform="translate(x, y)" -->
      <rect x="0" y="0" width="40" height="40" rx="4" transform="translate(340, 225)" />
    </g>

    </svg>
</body>
</html>
